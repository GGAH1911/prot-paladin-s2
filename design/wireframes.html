<!doctype html>
<html lang="ko" data-theme="light" data-font="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쐐기 가이드 확장 · UI 프로토타입</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ===== 토큰 (design/expansion-ui.md 4번과 같은 값) ===== */
:root{
  --bg:#F5F5F7;--surface:#FFFFFF;--ink:#1D1D1F;--ink-2:#424245;--muted:#6E6E73;--line:#D2D2D7;--fill:#E8E8ED;--link:#0066CC;--focus:#0071E3;
  --bar:rgba(245,245,247,.82);--sheet:rgba(0,0,0,.32);
  --role:#0066CC;           /* 역할 층 띠 */
  --common:#C7C7CC;         /* 공용 층 띠 */
  /* 태그 글자색 (라이트) */
  --t-tb:#B42318;--t-int:#6B3FD4;--t-cc:#8A5A00;--t-dodge:#B54708;--t-disp:#067647;--t-aoe:#C11574;--t-prio:#1D4ED8;--t-pos:#0E7090;--t-tip:#6E6E73;
  --r-tag:6px;--r-card:12px;--r-tile:18px;--r-pill:980px;
  --fs-cap:12px;--fs-sm:13px;--fs-item:15px;--fs-body:17px;--fs-h4:21px;--fs-h2:28px;--fs-h1:40px;
  --ease:cubic-bezier(.25,.1,.25,1);--dur:200ms;
  --title-font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body-font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ab-font:var(--body-font);
}
[data-theme=dark]{
  --bg:#000000;--surface:#1D1D1F;--ink:#F5F5F7;--ink-2:#D2D2D7;--muted:#86868B;--line:#424245;--fill:#2C2C2E;--link:#2997FF;--focus:#2997FF;
  --bar:rgba(22,22,23,.8);--sheet:rgba(0,0,0,.55);--role:#2997FF;--common:#48484A;
  --t-tb:#FF8A80;--t-int:#B69CFF;--t-cc:#F2C35B;--t-dodge:#FFA64D;--t-disp:#5FD8A0;--t-aoe:#FF7AC6;--t-prio:#7EB6FF;--t-pos:#5CC8E6;--t-tip:#98989D;
}
[data-font=a]{--title-font:"Cinzel",Georgia,serif;--ab-font:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#DADADF;font-family:var(--body-font);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
[data-theme=dark] body{background:#111}
button{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{display:block}

/* ===== 프로토타입 조작 바 (실제 사이트에는 없음) ===== */
.proto{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:#1D1D1F;color:#F5F5F7;font-size:12.5px}
.proto b{font-weight:700;color:#fff}
.proto .grp{display:inline-flex;align-items:center;gap:6px}
.proto .grp>span{color:#98989D}
.pseg{display:inline-flex;border:1px solid #48484A;border-radius:8px;overflow:hidden}
.pseg button{border:0;background:transparent;color:#F5F5F7;padding:4px 9px;cursor:pointer;font-size:12px}
.pseg button[aria-pressed=true]{background:#F5F5F7;color:#1D1D1F;font-weight:700}
.proto select{font:inherit;font-size:12px;background:#2C2C2E;color:#F5F5F7;border:1px solid #48484A;border-radius:8px;padding:4px 6px;max-width:260px}
.proto a{color:#7EB6FF}

/* ===== 기기 프레임 ===== */
.stage{padding:18px 12px 60px;display:flex;justify-content:center}
.device{width:100%;max-width:1280px;background:var(--bg);container-type:inline-size;container-name:dev;min-height:calc(100vh - 110px);position:relative;overflow:hidden;border-radius:10px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.device.phone{max-width:390px;border-radius:38px;border:10px solid #1D1D1F;box-shadow:0 20px 60px rgba(0,0,0,.25);min-height:844px;max-height:844px;overflow:auto}
[data-theme=dark] .device.phone{border-color:#3A3A3C}
.screen{min-height:100%;animation:fade var(--dur) var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.sheet-panel{animation:none!important}html{scroll-behavior:auto!important}*{transition:none!important}}

/* 화면 ID 라벨 */
.sid{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 10px;font-size:11px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,102,204,.05) 6px 12px);border-bottom:1px dashed var(--line)}
.sid b{color:var(--link);font-weight:700}
.sid code{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-2);word-break:break-all}

/* ===== 공통 조각 ===== */
.wm{font-family:var(--title-font);font-weight:700;letter-spacing:.01em}
[data-font=b] .wm{letter-spacing:-.02em}
.gnav{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;color:var(--ink-2)}
.gnav .wm{font-size:15px;color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.wide{max-width:980px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:var(--r-pill);padding:8px 16px;font-size:14px;font-weight:600;background:var(--link);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--link);padding:8px 4px}
.btn.gray{background:var(--fill);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.muted{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cls);flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.draft{display:inline-block;margin-left:6px!important;font-size:10.5px;font-weight:700;color:#B54708;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
[data-theme=dark] .draft{color:#FFA64D}
.badge{font-size:10.5px;font-weight:700;border-radius:var(--r-pill);padding:1px 7px;background:var(--fill);color:var(--muted);white-space:nowrap}
.badge.ready{background:rgba(3,118,71,.12);color:#067647}.badge.draft2{background:rgba(181,71,8,.12);color:#B54708}
[data-theme=dark] .badge.ready{color:#5FD8A0}[data-theme=dark] .badge.draft2{color:#FFA64D}
.ico{width:var(--s,36px);height:var(--s,36px);border-radius:50%;overflow:hidden;flex:0 0 auto;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--cls);background:var(--cls);display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s,36px)*.42)}
.ico img{width:100%;height:100%;object-fit:cover}
.ico.priest{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--line)}
.ab{font-family:var(--ab-font);font-weight:600}
[data-font=a] .ab{font-size:.93em}

/* ===== S1 선택 ===== */
.s1-hero{padding:56px 0 28px;text-align:left}
.s1-hero h1{font-family:var(--title-font);font-size:var(--fs-h1);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
[data-font=a] .s1-hero h1{letter-spacing:0;font-size:36px}
.s1-hero p{font-size:var(--fs-body);color:var(--muted);margin:0;line-height:1.5}
@container dev (min-width:700px){.s1-hero{padding:88px 0 40px}.s1-hero h1{font-size:56px}}
.summary{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.summary .in{display:flex;align-items:center;gap:8px;min-height:52px;flex-wrap:wrap;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:5px 11px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.empty{color:var(--muted);font-weight:500;border-style:dashed;background:transparent;cursor:default}
.summary .go{margin-left:auto}
.step{padding:36px 0 8px;transition:opacity var(--dur) var(--ease)}
.step.locked{opacity:.32;pointer-events:none}
.step h2{font-size:var(--fs-h2);margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
.step h2 span{color:var(--muted);font-weight:600}
.step .hint{font-size:14px;color:var(--muted);margin:0 0 18px}
.tiles{display:grid;gap:10px;grid-template-columns:1fr}
@container dev (min-width:560px){.tiles.c3{grid-template-columns:repeat(3,1fr)}.tiles.c2{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-tile);padding:16px 18px;cursor:pointer;transition:border-color var(--dur),box-shadow var(--dur)}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed=true]{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.tile .tt{font-size:17px;font-weight:700}
.tile .ts{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.tile .ro{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:0 0 auto}
.stiles{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@container dev (min-width:560px){.stiles{grid-template-columns:repeat(3,1fr)}}
@container dev (min-width:860px){.stiles{grid-template-columns:repeat(4,1fr)}}
.stile{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;min-height:58px}
.stile[aria-pressed=true]{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.stile .sn{font-size:14.5px;font-weight:700;line-height:1.2}
.stile .sc{font-size:12px;color:var(--cls-ink);font-weight:600}
.stile .badge{margin-top:3px;display:inline-block}
.clsgrp{margin:16px 0 8px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--cls-ink)}
.clsgrp:first-child{margin-top:0}
.s1-foot{padding:40px 0 80px;font-size:13px;color:var(--muted);line-height:1.6}

/* ===== 상단 고정 바 (애플 localnav 대응) ===== */
.lnav{position:sticky;top:0;z-index:30;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.lnav .in{height:52px;display:flex;align-items:center;gap:10px}
.lnav .nm{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.lnav .nm .h{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.lnav .nm .n{overflow:hidden;text-overflow:ellipsis}
@container dev (max-width:520px){.lnav .nm{font-size:14.5px}.lnav .in{gap:6px}}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:0 0 auto}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@container dev (max-width:520px){.seg button{padding:4px 7px;font-size:12px}}
.pill{border:0;border-radius:var(--r-pill);background:var(--link);color:#fff;font-size:12.5px;font-weight:600;padding:5px 12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.long{display:inline}.short{display:none}
@container dev (max-width:520px){.long{display:none}.short{display:inline}}

/* 같은 역할 전문화 줄 (chapternav 대응) */
.specrow{border-bottom:1px solid var(--line);background:var(--bg)}
.specrow .in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 0 8px}
.specrow .in::-webkit-scrollbar{display:none}
.sr{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;border:0;background:none;cursor:pointer;padding:2px 4px;font-size:11px;color:var(--ink-2);line-height:1.2;text-align:center}
.sr .ico{--s:32px}
.sr[aria-current=true]{color:var(--ink);font-weight:700}
.sr[aria-current=true] .ico{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--cls)}
.sr.soon{opacity:.55}
.sr .more{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:16px;color:var(--ink-2)}

/* 배너 */
.banner{margin:12px 0 0;border-radius:var(--r-card);padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
.banner .bt{flex:1}
.banner b{font-weight:700}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.banner.share{border-left:4px solid var(--cls)}
.banner.soon{border-left:4px solid var(--muted)}

/* ===== 치트시트 (애플 '기술 사양' 대응: 깔끔하지만 촘촘) ===== */
.ctrl{padding:0 0 6px;border-bottom:1px solid var(--line)}
.tabbar{position:sticky;top:52px;z-index:25;background:var(--bg);padding:8px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
@container dev (max-width:520px){.lensnote{display:none}.specrow .in{padding:6px 0 4px}.sr{min-width:56px;font-size:10.5px;gap:4px}.sr .ico{--s:28px}.dhead{padding:12px 0 2px}.row2 .lbl{display:none}.row2{gap:6px 8px}.dname{font-size:22px}.ft{padding:2px 7px;font-size:11.5px}}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink-2)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.row2 .g{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.row2 .lang{margin-left:auto}
@container dev (max-width:520px){.row2 .lang{margin-left:0}}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.ft{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-tag);padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--t)}
.ft[aria-pressed=false]{color:var(--muted);background:transparent;border-style:dashed;font-weight:500;text-decoration:line-through;text-decoration-color:var(--line)}
.lensnote{font-size:11.5px;color:var(--muted);margin-top:6px}
.dhead{padding:18px 0 6px}
.dname{font-family:var(--title-font);font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em}
[data-font=a] .dname{letter-spacing:.01em;font-size:24px}
.dsub{font-size:13px;color:var(--muted);margin:4px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:10px 0 2px}
.legend i{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
.card{background:var(--surface);border-radius:var(--r-card);margin:10px 0;overflow:hidden}
.card h3{margin:0;padding:11px 14px 5px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;letter-spacing:-.01em}
.card h3 small{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.card h3 small a{margin-right:8px}
.items{list-style:none;margin:0;padding:2px 0 8px}
.items li{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:4px 14px 4px 11px;font-size:var(--fs-item);line-height:1.42;border-left:3px solid var(--band,var(--common))}
.items li.role{--band:var(--role)}
.items li.spec{--band:var(--cls)}
.tag{font-size:11.5px;font-weight:700;color:var(--t);padding-top:2px;white-space:nowrap}
.need{font-size:10.5px;font-weight:800;border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}
.need.must{background:var(--t-tb);color:#fff}.need.rec{border:1px solid var(--t-int);color:var(--t-int)}
.resp{color:var(--cls-ink);font-weight:600}
.resp.none{color:var(--muted);font-weight:500}
.herocard{border-left:0}
.herocard h3 .hl{color:var(--cls-ink)}
.deep{border-top:1px solid var(--line)}
.deep summary{list-style:none;cursor:pointer;padding:8px 14px;font-size:13px;font-weight:600;color:var(--link);display:flex;justify-content:space-between}
.deep summary::-webkit-details-marker{display:none}
.deep[open] summary .chev{transform:rotate(180deg)}
.chev{transition:transform var(--dur)}
.dblk h4{margin:8px 14px 2px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.lay{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;background:var(--fill);color:var(--muted)}
.lay.role{background:rgba(0,102,204,.1);color:var(--role)}
.lay.spec{background:transparent;color:var(--cls-ink);border:1px solid var(--cls)}
.dover{margin:4px 14px 6px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 4px}
.sechead h2{font-size:19px;margin:0;font-weight:700}
.sechead p{margin:0;font-size:12px;color:var(--muted)}
.foot{padding:28px 0 60px;font-size:12px;color:var(--muted);line-height:1.6}

/* ===== S2b 층 비교 ===== */
.cmp2{display:grid;gap:14px;grid-template-columns:1fr}
@container dev (min-width:760px){.cmp2{grid-template-columns:1fr 1fr}}
.cmp2 .colh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:6px 0 0}

/* ===== S3 스킬 가이드 (애플 제품 소개 섹션 대응) ===== */
.ghero{padding:56px 0 40px;text-align:center}
.ghero .eb{font-size:14px;font-weight:600;color:var(--cls-ink);margin:0 0 8px}
.ghero h1{font-family:var(--title-font);font-size:48px;line-height:1.05;margin:0;letter-spacing:-.03em}
[data-font=a] .ghero h1{letter-spacing:0;font-size:42px}
.ghero p{font-size:19px;line-height:1.45;color:var(--muted);margin:14px auto 0;max-width:560px}
.ghero .lk{margin-top:18px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:15px}
@container dev (min-width:760px){.ghero{padding:96px 0 64px}.ghero h1{font-size:72px}}
.gsec{padding:48px 0;border-top:1px solid var(--line)}
@container dev (min-width:760px){.gsec{padding:80px 0}}
.gsec h2{font-size:32px;line-height:1.1;margin:0;letter-spacing:-.02em}
.gsec h2 span{color:var(--muted)}
@container dev (min-width:760px){.gsec h2{font-size:44px}}
.gsec .lead{font-size:17px;color:var(--muted);margin:10px 0 24px;line-height:1.5;max-width:620px}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.kgrid{display:grid;gap:8px;grid-template-columns:1fr}
@container dev (min-width:640px){.kgrid{grid-template-columns:1fr 1fr}}
.kc{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px 14px}
.kc img{width:38px;height:38px;border-radius:8px;flex:0 0 auto}
.kc .kn{font-size:15px;font-weight:700}
.kc .kk{font-size:12px;color:var(--muted)}
.kc .kd{font-size:13.5px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.codes .cr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.codes .cr:first-child{border-top:0}
.codes code{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink-2)}
@media print{.proto,.sid,.lnav,.specrow,.gprint{display:none!important}.device{box-shadow:none;border:0;max-height:none}.gsec{break-inside:avoid;padding:16px 0}.ghero{padding:12px 0}}

/* ===== S4 비교 (애플 비교 페이지 대응) ===== */
.cmphead{position:sticky;top:52px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
.cmpcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmpcol{text-align:center}
.cmpcol select{width:100%;font:inherit;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;text-align:center}
.cmprow{padding:18px 0;border-bottom:1px solid var(--line)}
.cmprow .lb{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:8px}
.cmprow .vals{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;font-size:15px;line-height:1.45}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;display:block}
.meter{display:inline-flex;gap:3px}.meter i{width:18px;height:6px;border-radius:3px;background:var(--fill)}.meter i.on{background:var(--cls)}

/* ===== S5 전환 시트 ===== */
.sheet{position:absolute;inset:0;z-index:60;background:var(--sheet);display:flex;align-items:flex-end;justify-content:center}
.device:not(.phone) .sheet{position:fixed;align-items:center}
.sheet-panel{width:100%;max-width:720px;max-height:88%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:up var(--dur) var(--ease)}
.device:not(.phone) .sheet-panel{border-radius:18px;max-height:84vh}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:var(--bg);padding:14px 18px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-head .t{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{margin:0;font-size:21px}
.x{border:0;background:var(--fill);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
.search{width:100%;margin-top:10px;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px}
.sheet-body{padding:12px 18px 24px}

/* ===== S8/S9 ===== */
.center{min-height:560px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px}
.center h1{font-size:34px;margin:0 0 10px;letter-spacing:-.02em}
.center p{color:var(--muted);font-size:17px;margin:0 0 18px;line-height:1.5}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;text-align:left;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;border-top:0}
.tbl code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}

/* ===== 지도 ===== */
.map h1{font-size:34px;margin:40px 0 6px;letter-spacing:-.02em}
.mapl{list-style:none;padding:0;margin:20px 0}
.mapl li{background:var(--surface);border-radius:14px;padding:14px 16px;margin:8px 0;display:grid;grid-template-columns:52px 1fr;gap:4px 12px}
.mapl .id{font-weight:800;color:var(--link);font-size:18px;grid-row:span 3}
.mapl .nmm{font-weight:700;font-size:16px}
.mapl code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);word-break:break-all}
.mapl .ds{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.flowline{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface);border-radius:12px;padding:14px;line-height:1.7;overflow-x:auto;white-space:pre;color:var(--ink-2)}
</style>
</head>

function toScreenFor(key){return status(key)==="soon"?"#S7/"+key:"#S2/"+key;}
document.addEventListener("click",e=>{

 if(el.tagName==="A") e.preventDefault();
 const P=ST.s1;
 switch(a){
  case "pickrole":P.role=v;P.spec=null;P.hero=null;render();smooth("st-spec");break;
  case "pickspec":P.spec=v;P.hero=null;render();smooth("st-hero");break;

  case "ft":{const s=tagsFor(SPEC[ST.view].role);s.has(v)?s.delete(v):s.add(v);render();break;}
  case "expall":ST.openDeep=!ST.openDeep;render();break;
  case "backmine":ST.view=ST.saved;ST.shareFrom=null;go("#S2");break;
  case "savethis":ST.saved=ST.view;ST.shareFrom=null;go("#S2");break;
 }
});
